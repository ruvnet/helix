name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality-gate:
    name: fmt · clippy · test · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Benchmarks compile
        run: cargo bench --no-run

  security-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # Enforces the permissive-only, crates.io-only dependency graph the
      # NeuroSleep research rail depends on (see deny.toml).
      - name: Check licenses, advisories, bans and sources
        run: cargo deny check

  neurosleep-boundary:
    name: NeuroSleep safety gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # These scripts fail closed: a missing tool or a search error is a
      # failure, not a pass. They must run on every change because the
      # one-way boundary and the prohibited-claim surface are static
      # properties no unit test can observe from inside the crate.
      - name: Static one-way boundary
        run: ./validation/neurosleep/check_safety_boundary.sh
      - name: Prohibited diagnostic and therapeutic claims
        run: ./validation/neurosleep/check_forbidden_claims.sh
